<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Token Sale</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#eef0f4; --muted:#9aa3b2; --card:#181b22; --line:#2a2f3a; --accent:#7c5cff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7fb; --fg:#14161c; --muted:#5d6677; --card:#fff; --line:#dde1ea; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 16px calc(48px + env(safe-area-inset-bottom)); }
  h1 { font-size:1.5rem; margin:0 0 4px; } h2 { font-size:1.05rem; margin:26px 0 10px; } h3 { font-size:1rem; margin:18px 0 8px; }
  .muted { color:var(--muted); font-size:.92rem; } .mono { font-family:ui-monospace, monospace; word-break:break-all; font-size:.85rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .wallet { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 12px; min-height:64px; color:var(--fg); text-align:left; font:inherit; }
  .wallet small { display:block; color:var(--muted); font-size:.78rem; }
  label { display:block; margin:8px 0 4px; }
  select, input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:16px; margin-bottom:10px; }
  button.main { width:100%; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:15px; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; }
  button.link { background:none; border:0; color:var(--accent); font:inherit; padding:0 0 0 6px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  dt { color:var(--muted); } dd { margin:0; }
  #status { margin-top:14px; min-height:1.5em; word-break:break-word; } #status.err { color:#ff6b6b; }
  [hidden] { display:none !important; }
</style>
<script type="importmap">
{ "imports": {
  "@solana/web3.js": "https://esm.sh/@solana/web3.js@1.98",
  "@solana/spl-token": "https://esm.sh/@solana/spl-token@0.4?deps=@solana/web3.js@1.98",
  "@wallet-standard/app": "https://esm.sh/@wallet-standard/app@1"
} }
</script>
</head>
<body>
<main>
  <h1>Token Sale</h1>
  <p id="banner" class="muted">Loading…</p>

  <section id="connect">
    <h2>1. Choose your wallet</h2>
    <div id="wallet-list" class="grid"></div>
    <p class="muted" id="hint"></p>
  </section>

  <section id="buy" hidden>
    <h2>2. Choose an amount</h2>
    <p class="muted">Connected: <span id="who"></span><button id="disconnect" class="link">Disconnect</button></p>
    <label for="pay">Pay with</label>
    <select id="pay"><option value="">SOL</option></select>
    <label for="sol" id="amount-label">SOL to spend</label>
    <input id="sol" inputmode="decimal" placeholder="0.5" autocomplete="off" />
    <button id="quote" class="main">Get quote</button>

    <div id="summary" hidden>
      <h3>You will pay and receive exactly</h3>
      <dl>
        <dt>You pay</dt><dd id="s-pay"></dd>
        <dt>You receive</dt><dd id="s-get"></dd>
        <dt>Payment goes to</dt><dd id="s-to" class="mono"></dd>
        <dt>Network fee</dt><dd>0 SOL (paid by the sale)</dd>
      </dl>
      <p class="muted" id="s-note">Both transfers happen in one transaction. If either fails, nothing moves.</p>
      <button id="sign" class="main">Approve in wallet</button>
    </div>
    <p id="status" role="status"></p>
  </section>
</main>

<script type="module">
import { Connection, VersionedTransaction } from '@solana/web3.js';
import { getWallets } from '@wallet-standard/app';
import { decodePurchase, decodeTokenPurchase, formatUnits, loadLookupTables, pk, tableKeys } from './purchase.js';

const $ = (id) => document.getElementById(id);
const enc = encodeURIComponent;
const pageUrl = location.origin + location.pathname;
let config = { enabled: false };
let adapter = null;
let pendingTx = null;
let pendingPayMint = '';
let heldTokens = [];
let solEntry = null; // the wallet's SOL, shaped like a token, when USD values are available

const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const bytesToB64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
const setStatus = (t, err = false) => { $('status').textContent = t; $('status').classList.toggle('err', err); };

// Deep links open THIS page inside each wallet's own in-app browser, where the wallet is available.
const WALLETS = [
  { label: 'Phantom',  match: /phantom/i,   legacy: () => window.phantom?.solana,
    link: (u) => `https://phantom.com/ul/browse/${enc(u)}?ref=${enc(location.origin)}` },
  { label: 'Solflare', match: /solflare/i,  legacy: () => window.solflare,
    link: (u) => `https://solflare.com/ul/v1/browse/${enc(u)}?ref=${enc(location.origin)}` },
  { label: 'Backpack', match: /backpack/i,  legacy: () => window.backpack,
    link: (u) => `https://backpack.app/ul/v1/browse/${enc(u)}?ref=${enc(location.origin)}` },
  { label: 'MetaMask', match: /metamask/i,  legacy: () => null,
    link: (u) => `https://link.metamask.io/dapp/${u.replace(/^https?:\/\//, '')}` },
  { label: 'Trust Wallet', match: /trust/i, legacy: () => window.trustwallet?.solana,
    link: (u) => `https://link.trustwallet.com/open_url?coin_id=501&url=${enc(u)}` },
  { label: 'Coinbase Wallet', match: /coinbase/i, legacy: () => window.coinbaseSolana,
    link: (u) => `https://go.cb-w.com/dapp?cb_url=${enc(u)}` },
  { label: 'OKX Wallet', match: /okx/i, legacy: () => window.okxwallet?.solana,
    link: (u) => `https://web3.okx.com/download?deeplink=${enc('okx://wallet/dapp/url?dappUrl=' + enc(u))}` },
  { label: 'Bitget Wallet', match: /bitget|bitkeep/i, legacy: () => window.bitkeep?.solana || window.bitget?.solana,
    link: (u) => `https://bkcode.vip?action=dapp&url=${u}` },
  { label: 'Jupiter', match: /jupiter/i,    legacy: () => null, link: null },
];

function standardAdapter(w) {
  let account;
  return {
    name: w.name,
    async connect() {
      const { accounts } = await w.features['standard:connect'].connect();
      account = accounts.find((a) => a.chains?.some((c) => c.startsWith('solana:'))) ?? accounts[0];
      if (!account) throw new Error('The wallet did not return a Solana account');
      return account.address;
    },
    async sign(tx) {
      const [out] = await w.features['solana:signTransaction'].signTransaction({ account, transaction: tx.serialize(), chain: config.chain });
      return out.signedTransaction;
    },
    async disconnect() { try { await w.features['standard:disconnect']?.disconnect(); } catch {} },
  };
}

function legacyAdapter(name, p) {
  return {
    name,
    async connect() { const r = await p.connect(); return (r?.publicKey || p.publicKey).toString(); },
    async sign(tx) { return (await p.signTransaction(tx)).serialize(); },
    async disconnect() { try { await p.disconnect?.(); } catch {} },
  };
}

function detect(def) {
  const std = getWallets().get().find((w) => def.match.test(w.name) && 'standard:connect' in w.features && 'solana:signTransaction' in w.features);
  if (std) return standardAdapter(std);
  const p = def.legacy();
  if (p?.signTransaction && p?.connect) return legacyAdapter(def.label, p);
  return null;
}

function renderWallets() {
  const list = $('wallet-list');
  list.replaceChildren();
  let anyDetected = false;
  for (const def of WALLETS) {
    const found = detect(def);
    anyDetected ||= Boolean(found);
    const b = document.createElement('button');
    b.className = 'wallet';
    b.textContent = def.label;
    const small = document.createElement('small');
    small.textContent = found ? 'Tap to connect' : def.link ? 'Tap to open in app' : 'Copy link, open in app';
    b.append(small);
    b.onclick = () => (found ? connect(found) : openInApp(def));
    list.append(b);
  }
  $('hint').textContent = anyDetected
    ? ''
    : 'Tap your wallet. This page will reopen inside the wallet app, then connect there.';
}

async function openInApp(def) {
  if (def.link) { location.href = def.link(pageUrl); return; }
  try { await navigator.clipboard.writeText(pageUrl); } catch {}
  setStatus(`Link copied. Open ${def.label}, open its browser (globe icon) and paste this link.`);
}

async function connect(a) {
  try {
    setStatus('Waiting for wallet approval…');
    const address = await a.connect();
    adapter = a;
    $('who').textContent = `${a.name} · ${address.slice(0, 4)}…${address.slice(-4)}`;
    $('who').dataset.address = address;
    $('connect').hidden = true;
    $('buy').hidden = false;
    setStatus('');
    loadTokens(address);
  } catch (e) { setStatus(e.message || 'Connection cancelled', true); }
}

const usd = (v) => (v > 0 && v < 0.01 ? '<$0.01' : v.toLocaleString(undefined, { style: 'currency', currency: 'USD' }));
const shortBal = (raw, decimals) => {
  const [w, f = ''] = formatUnits(BigInt(raw), decimals).split('.');
  return f ? `${w}.${f.slice(0, 4)}`.replace(/\.$/, '') : w;
};
// The wallet's holdings (SOL + tokens), most valuable first. Holdings without a price go last.
const holdings = () => [...(solEntry ? [solEntry] : []), ...heldTokens];
const current = () => holdings().find((x) => x.mint === $('pay').value) || null;
const priced = (t) => Boolean(t && t.usdPrice > 0);
const valueOf = (t) => (priced(t) ? (Number(t.amount) / 10 ** t.decimals) * t.usdPrice : -1);

async function loadTokens(address) {
  const sel = $('pay');
  sel.replaceChildren(new Option('SOL', ''));
  heldTokens = []; solEntry = null;
  updateLabel();
  if (!config.swapEnabled) return;
  try {
    const data = await (await fetch(`/api/tokens?owner=${enc(address)}`)).json();
    heldTokens = (data.tokens || []).map((t) => ({ ...t, usdValue: valueOf(t) }));
    if (data.usd && data.sol) solEntry = { mint: '', symbol: 'SOL', decimals: 9, amount: data.sol.lamports, usdPrice: data.sol.usdPrice };
    const list = holdings().map((t) => ({ ...t, usdValue: valueOf(t) })).sort((a, b) => b.usdValue - a.usdValue);
    sel.replaceChildren();
    for (const t of list) {
      const worth = priced(t) ? usd(t.usdValue) : 'no price';
      const thin = priced(t) && t.liquidity != null && t.liquidity < 10000 ? ' · low liquidity' : '';
      sel.append(new Option(`${t.symbol} · ${worth}${thin} · ${shortBal(t.amount, t.decimals)} held`, t.mint));
    }
    if (!list.length) sel.append(new Option('SOL', ''));
    if (solEntry?.usdPrice) {
      const p = solEntry.usdPrice;
      $('banner').textContent += ` (about ${usd(config.minSol * p)} to ${usd(config.maxSol * p)})`;
    }
    updateLabel();
  } catch { sel.replaceChildren(new Option('SOL', '')); updateLabel(); /* SOL only */ }
}

function updateLabel() {
  const t = current();
  const inUsd = priced(t);
  $('amount-label').textContent = inUsd ? 'USD to spend' : `${t ? t.symbol : 'SOL'} to spend`;
  $('sol').placeholder = inUsd ? '10' : (t ? '1000' : '0.5');
  $('summary').hidden = true; pendingTx = null;
}
$('pay').onchange = updateLabel;

$('disconnect').onclick = async () => {
  await adapter?.disconnect();
  adapter = pendingTx = null;
  $('buy').hidden = true; $('summary').hidden = true; $('connect').hidden = false;
  setStatus('');
};

$('quote').onclick = async () => {
  $('summary').hidden = true; pendingTx = null;
  try {
    setStatus('Preparing your purchase…');
    const address = $('who').dataset.address;
    const payMint = $('pay').value;
    const token = holdings().find((x) => x.mint === payMint);
    const inUsd = priced(token);
    const amountField = inUsd ? { usd: $('sol').value } : (payMint ? { amount: $('sol').value } : { sol: $('sol').value });
    const body = payMint ? { buyer: address, payMint, wallet: adapter?.name, ...amountField } : { buyer: address, ...amountField };
    const worth = (units, decimals) => (inUsd ? ` (about ${usd((Number(units) / 10 ** decimals) * token.usdPrice)})` : '');
    const res = await fetch('/api/quote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not get a quote');
    // Some wallet apps will not let you approve while the wallet holds almost no SOL, so the sale may have just sent
    // a small top-up. Wait for it to land before showing the summary.
    if (data.drip) await waitForTopUp(data.drip);
    const tx = VersionedTransaction.deserialize(b64ToBytes(data.transaction));
    const ctx = { seller: pk(config.seller), receiver: pk(config.receiver), mint: pk(config.mint) };

    // Don't trust the server's description: decode the transaction itself and show what it really does.
    if (!payMint) {
      const d = decodePurchase(tx, ctx);
      if (d.buyer !== address || d.decimals !== config.decimals) throw new Error('Transaction does not match your wallet');
      $('s-pay').textContent = `${formatUnits(d.lamports, 9)} SOL${worth(d.lamports, 9)}`;
      $('s-get').textContent = `${formatUnits(d.tokenRaw, d.decimals)} tokens`;
      $('s-note').textContent = 'Both transfers happen in one transaction. If either fails, nothing moves.';
    } else {
      setStatus('Verifying the transaction…');
      // Read the lookup tables ourselves (not from our server) so the check stays independent.
      // The same goes for which token program (classic or Token-2022) owns the payment token.
      let tables = null, payProgram = null;
      for (const url of config.publicRpcs) {
        try {
          const rpc = new Connection(url, 'confirmed');
          const [t, mintInfo] = await Promise.all([loadLookupTables(rpc, tableKeys(tx)), rpc.getAccountInfo(pk(payMint))]);
          if (!mintInfo) throw new Error('Token not found');
          tables = t; payProgram = mintInfo.owner; break;
        } catch { /* try the next RPC */ }
      }
      if (!tables) throw new Error('Could not verify the transaction in your browser. Please try again in a moment.');
      const d = decodeTokenPurchase(tx, { ...ctx, payMint: pk(payMint), payProgram }, tables);
      if (d.buyer !== address || d.decimals !== config.decimals) throw new Error('Transaction does not match your wallet');
      $('s-pay').textContent = `${formatUnits(d.amountIn, token.decimals)} ${token.symbol}${worth(d.amountIn, token.decimals)}`;
      $('s-get').textContent = `${formatUnits(d.tokenRaw, d.decimals)} tokens`;
      $('s-note').textContent = `Your ${token.symbol} is swapped to SOL (at least ${formatUnits(BigInt(data.minOutLamports), 9)} SOL guaranteed) and the tokens are delivered in the same transaction. If anything fails, nothing moves.`;
      pendingPayMint = payMint;
    }
    if (data.drip) $('s-note').textContent += ` We also sent ${formatUnits(BigInt(data.dripLamports), 9)} SOL to your wallet so your wallet app can approve this. It is yours to keep.`;
    pendingTx = tx;
    $('s-to').textContent = config.receiver;
    $('summary').hidden = false;
    setStatus('Check the details, then approve in your wallet. Valid for about 90 seconds.');
  } catch (e) { setStatus(e.message, true); }
};

$('sign').onclick = async () => {
  if (!pendingTx) return;
  try {
    $('sign').disabled = true;
    setStatus('Approve the transaction in your wallet…');
    const signed = await adapter.sign(pendingTx);
    setStatus('Submitting…');
    const res = await fetch('/api/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ transaction: bytesToB64(signed), payMint: $('pay').value || undefined }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Submit failed');
    $('summary').hidden = true; pendingTx = null;
    await waitForConfirmation(data.signature);
  } catch (e) { setStatus(e.message || 'Signing was cancelled', true); }
  finally { $('sign').disabled = false; }
};

async function waitForTopUp(sig) {
  setStatus('Getting your wallet ready (a one-time, free top-up)…');
  for (let i = 0; i < 25; i++) {
    const { status } = await (await fetch(`/api/status?sig=${enc(sig)}`)).json();
    if (status === 'confirmed' || status === 'finalized') return;
    if (status === 'failed') break;
    await new Promise((r) => setTimeout(r, 1000));
  }
  throw new Error('Getting your wallet ready took too long. Please tap Get quote again.');
}

async function waitForConfirmation(sig) {
  const suffix = config.cluster === 'devnet' ? '?cluster=devnet' : '';
  const link = `https://solscan.io/tx/${sig}${suffix}`;
  for (let i = 0; i < 40; i++) {
    setStatus('Confirming…');
    const { status } = await (await fetch(`/api/status?sig=${enc(sig)}`)).json();
    if (status === 'confirmed' || status === 'finalized') return setStatus(`Done. Your tokens are in your wallet. ${link}`);
    if (status === 'failed') return setStatus(`The transaction failed, nothing was taken. ${link}`, true);
    await new Promise((r) => setTimeout(r, 1500));
  }
  setStatus(`Still confirming. Check here: ${link}`);
}

async function init() {
  try { config = await (await fetch('/api/config')).json(); } catch {}
  $('banner').textContent = config.enabled
    ? `${config.tokensPerSol.toLocaleString()} tokens per 1 SOL · min ${config.minSol} SOL · max ${config.maxSol} SOL`
    : 'The sale is not open yet. You can still test connecting a wallet.';
  $('quote').disabled = !config.enabled;
  renderWallets();
  const { on } = getWallets();
  on('register', renderWallets);
}
init();
</script>
</body>
</html>
