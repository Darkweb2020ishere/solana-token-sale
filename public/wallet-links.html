<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Wallet link tester</title>
<style>
 body{font:16px/1.5 -apple-system,system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:16px 16px 48px}
 h1{font-size:20px} h2{font-size:16px;margin:22px 0 4px} p{color:#9aa4b2;margin:4px 0}
 a.b{display:block;margin:8px 0;padding:14px;border-radius:12px;background:#1f2937;color:#fff;text-decoration:none;border:1px solid #334155}
 a.b small{display:block;color:#9aa4b2;word-break:break-all;font-size:11px;margin-top:4px}
 #where{padding:12px;border-radius:12px;background:#111827;border:1px solid #334155;font-size:13px;word-break:break-all}
 .ok{color:#7ee787} .tag{font-size:11px;color:#f0b429}
</style></head><body>
<h1>Wallet link tester</h1>
<p>TEST PAGE, not part of the sale. Tap one button at a time. Each only tries to open the wallet app. Then tell me which letter opened <b>this page inside the wallet's own browser</b> (not just the wallet's home screen).</p>
<div id="where">Checking where this page is open…</div>
<div id="links"></div>
<script>
const here = location.origin + '/wallet-links.html';
const U = encodeURIComponent(here);
const tp = (chain) => `tpdapp://open?params=${encodeURIComponent(JSON.stringify(chain ? { url: here, chain, source: 'tester' } : { url: here, source: 'tester' }))}`;
const groups = [
 ['TokenPocket', 'documented link, Solana support unconfirmed', [
   ['TP1', tp('Solana')], ['TP2', tp('')], ['TP3', tp('Ethereum')]]],
 ['Zerion', 'GUESSES, only zerion://wc is documented (it needs a connection code)', [
   ['ZR1', `zerion://browser?url=${U}`], ['ZR2', `zerion://browse?url=${U}`], ['ZR3', `zerion://dapp?url=${U}`]]],
 ['Binance (Web3 Wallet)', 'GUESSES, nothing documented', [
   ['BN1', `bnc://app.binance.com/cedefi/dapp?url=${U}`], ['BN2', `bnc://app.binance.com/cedefi/dapp?dappUrl=${U}`]]],
 ['Bybit', 'GUESSES, nothing documented', [
   ['BY1', `bybit://dapp?url=${U}`], ['BY2', `bybitapp://open/dapp?url=${U}`]]],
 ['SafePal', 'GUESSES, nothing documented', [
   ['SP1', `safepal://dapp?url=${U}`], ['SP2', `https://link.safepal.com/dapp?url=${U}`]]],
];
const box = document.getElementById('links');
for (const [name, note, items] of groups) {
  const h = document.createElement('h2'); h.textContent = name; box.append(h);
  const p = document.createElement('p'); p.className = 'tag'; p.textContent = note; box.append(p);
  for (const [label, href] of items) {
    const a = document.createElement('a'); a.className = 'b'; a.href = href; a.textContent = label;
    const s = document.createElement('small'); s.textContent = href; a.append(s); box.append(a);
  }
}
const ua = navigator.userAgent;
const injected = Object.keys(window).filter((k) => /solana|phantom|wallet|ethereum|tokenpocket|binance|bybit|safepal/i.test(k));
document.getElementById('where').innerHTML =
 (/Safari\//.test(ua) ? 'This looks like normal Safari.' : '<span class="ok">NOT normal Safari: this may be inside a wallet browser.</span>') +
 '<br>Injected names: ' + (injected.join(', ') || 'none') + '<br>UA: ' + ua;
</script>
</body></html>
